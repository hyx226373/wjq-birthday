<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>王竞乾 生日快乐 🎂</title>
  <style>
    /* System font stack & base reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --bg-gradient: linear-gradient(145deg, #fff0f3 0%, #fff7eb 45%, #f2f5ff 100%);
      --text-main: #3d314a;
      --text-muted: #7b6f84;
      --primary: #ff6b8b;
      --primary-light: #ff8da6;
      --primary-dark: #e8486e;
      --accent-gold: #ffbe3d;
      --accent-cream: #fff9f0;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 220, 230, 0.7);
      --shadow-sm: 0 4px 15px rgba(220, 100, 130, 0.08);
      --shadow-md: 0 8px 30px rgba(220, 100, 130, 0.13);
      --shadow-lg: 0 16px 40px rgba(220, 100, 130, 0.18);
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      line-height: 1.6;
    }

    /* Floating balloons container */
    .balloons-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .balloon {
      position: absolute;
      bottom: -120px;
      width: 44px;
      height: 56px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      opacity: 0.75;
      animation: floatUp 15s linear infinite;
      box-shadow: inset -4px -4px 10px rgba(0,0,0,0.06);
    }
    .balloon::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 28px;
      background: rgba(160, 150, 170, 0.5);
    }
    .balloon::before {
      content: "";
      position: absolute;
      bottom: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 4px;
      border-radius: 2px;
      background: inherit;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-120vh) rotate(18deg) translateX(40px);
        opacity: 0;
      }
    }

    /* Ambient Canvas for Confetti */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    /* Main Container */
    .app-wrapper {
      position: relative;
      z-index: 10;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 18px 60px;
    }

    /* Audio Toggle Button */
    .audio-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 180, 200, 0.6);
      border-radius: 30px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
    }
    .audio-btn:hover {
      transform: scale(1.05);
      background: #ffffff;
      box-shadow: var(--shadow-md);
    }
    .audio-btn.playing {
      background: #fff0f4;
      border-color: var(--primary);
      animation: pulseMusic 2s infinite ease-in-out;
    }
    @keyframes pulseMusic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Hero Section */
    .hero-section {
      text-align: center;
      padding: 30px 10px 20px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #ffeef2, #fff4e5);
      border: 1px solid #ffd6e0;
      color: var(--primary-dark);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(255, 107, 139, 0.12);
      animation: gentleBounce 2.5s infinite ease-in-out;
    }
    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .main-title {
      font-size: clamp(2rem, 6.5vw, 2.75rem);
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ff4b72 0%, #ff8c42 50%, #9d4edd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(255, 107, 139, 0.2));
      animation: titleFloat 3.5s infinite ease-in-out;
    }
    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 440px;
      margin: 0 auto 10px;
      font-weight: 400;
    }

    /* Accessibility / reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Cake Card Section */
    .cake-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 30px 20px 24px;
      box-shadow: var(--shadow-md);
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }

    .cake-instruction {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .cake-instruction span.icon {
      font-size: 16px;
      animation: wiggle 1.8s infinite ease-in-out;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }

    /* Cake Stage */
    .cake-stage {
      position: relative;
      width: 280px;
      height: 250px;
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* Candles Row */
    .candles-row {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 14px;
      z-index: 5;
      height: 72px;
      padding: 0 10px;
    }

    .candle-unit {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      padding: 0 4px;
      transition: transform 0.2s ease;
    }
    .candle-unit:active {
      transform: scale(0.92);
    }

    /* Flame */
    .flame-wrapper {
      position: relative;
      width: 18px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
    }

    .flame {
      width: 14px;
      height: 22px;
      background: radial-gradient(ellipse at bottom, #fffdf0 10%, #ffd000 45%, #ff5e00 85%);
      border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%;
      box-shadow: 0 0 12px #ffb300, 0 0 24px rgba(255, 94, 0, 0.6);
      transform-origin: 50% 90%;
      animation: flicker 1.2s infinite ease-in-out alternate;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .candle-unit:nth-child(2n) .flame {
      animation-duration: 0.9s;
      animation-delay: 0.2s;
    }
    .candle-unit:nth-child(3n) .flame {
      animation-duration: 1.4s;
      animation-delay: 0.5s;
    }

    @keyframes flicker {
      0% {
        transform: scale(1) rotate(-1.5deg) skewX(-1deg);
        box-shadow: 0 0 10px #ffb300, 0 0 20px rgba(255, 94, 0, 0.5);
      }
      25% {
        transform: scale(1.06, 0.96) rotate(1.5deg) skewX(2deg);
      }
      50% {
        transform: scale(0.96, 1.04) rotate(-2.5deg) skewX(-1.5deg);
        box-shadow: 0 0 15px #ffb300, 0 0 28px rgba(255, 94, 0, 0.7);
      }
      75% {
        transform: scale(1.03, 1.02) rotate(2deg) skewX(1deg);
      }
      100% {
        transform: scale(0.98, 0.98) rotate(-1deg) skewX(-2deg);
        box-shadow: 0 0 12px #ffb300, 0 0 22px rgba(255, 94, 0, 0.6);
      }
    }

    /* Smoke puff on blowout */
    .smoke-puff {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 14px;
      height: 14px;
      background: radial-gradient(circle, rgba(170,170,170,0.6) 0%, rgba(200,200,200,0) 70%);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }
    .candle-unit.extinguished .flame {
      opacity: 0;
      transform: scale(0.1);
      box-shadow: none;
    }
    .candle-unit.extinguished .smoke-puff {
      animation: smokeRise 1.2s forwards ease-out;
    }

    @keyframes smokeRise {
      0% {
        transform: translateX(-50%) scale(0.4);
        opacity: 0.8;
      }
      50% {
        transform: translateX(-70%) translateY(-22px) scale(1.5);
        opacity: 0.5;
      }
      100% {
        transform: translateX(-30%) translateY(-45px) scale(2.2);
        opacity: 0;
      }
    }

    /* Wick */
    .candle-wick {
      width: 2.5px;
      height: 6px;
      background: #4a3e3d;
      border-radius: 1px;
    }

    /* Candle Stick */
    .candle-stick {
      width: 11px;
      height: 42px;
      border-radius: 5px 5px 2px 2px;
      box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8), inset -1px -1px 2px rgba(0, 0, 0, 0.12), 0 3px 6px rgba(0,0,0,0.08);
      position: relative;
    }

    /* Candle colors */
    .c-color-0 { background: repeating-linear-gradient(45deg, #ff85a1, #ff85a1 4px, #ffffff 4px, #ffffff 8px); }
    .c-color-1 { background: repeating-linear-gradient(45deg, #70d6ff, #70d6ff 4px, #ffffff 4px, #ffffff 8px); }
    .c-color-2 { background: repeating-linear-gradient(45deg, #ffd166, #ffd166 4px, #ffffff 4px, #ffffff 8px); }
    .c-color-3 { background: repeating-linear-gradient(45deg, #c77dff, #c77dff 4px, #ffffff 4px, #ffffff 8px); }
    .c-color-4 { background: repeating-linear-gradient(45deg, #06d6a0, #06d6a0 4px, #ffffff 4px, #ffffff 8px); }
    .c-color-5 { background: repeating-linear-gradient(45deg, #ff9770, #ff9770 4px, #ffffff 4px, #ffffff 8px); }

    /* SVG Cake Graphic */
    .cake-svg {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 18px rgba(180, 80, 110, 0.15));
    }

    /* Cake Controls */
    .cake-controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: none;
      outline: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff6b8b, #ff4071);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(255, 64, 113, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 64, 113, 0.45);
    }
    .btn-primary:active {
      transform: translateY(1px);
    }
    .btn-secondary {
      background: #ffffff;
      color: #4a3e3d;
      border: 1px solid rgba(220, 180, 195, 0.6);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover {
      background: #fff8f9;
      transform: translateY(-2px);
    }

    /* Wish Banner / Message popup */
    .wish-banner {
      margin-top: 20px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #fff3e6, #ffeef2);
      border: 1.5px dashed #ff99b6;
      border-radius: var(--radius-md);
      color: #e83366;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      display: none;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      box-shadow: 0 4px 14px rgba(255, 107, 139, 0.15);
    }
    .wish-banner.visible {
      display: block;
    }
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Section Titles */
    .section-header {
      text-align: center;
      margin: 36px 0 18px;
    }
    .section-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .section-title::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 3px;
      background: linear-gradient(to right, var(--primary), var(--accent-gold));
      border-radius: 2px;
    }

    /* Letter Card */
    .letter-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      padding: 28px 24px 26px;
      box-shadow: var(--shadow-md);
      margin-bottom: 32px;
      position: relative;
      background-image: radial-gradient(rgba(255, 182, 193, 0.28) 1.5px, transparent 1.5px);
      background-size: 22px 22px;
      transition: transform 0.3s ease;
    }
    .letter-card:hover {
      transform: translateY(-2px);
    }
    .letter-seal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #fff0f5, #ffe8ee);
      border: 1px solid #ffd1dc;
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }
    .letter-content {
      font-size: 15px;
      line-height: 1.85;
      color: #4a3e3d;
      white-space: pre-line;
      text-align: justify;
    }

    /* Wishes Grid */
    .wishes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 34px;
    }
    .wish-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 215, 225, 0.8);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: flex-start;
      gap: 14px;
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
    }
    .wish-card.in-view {
      opacity: 1;
      transform: translateY(0);
    }
    .wish-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-3px);
    }
    .wish-icon-box {
      font-size: 26px;
      background: linear-gradient(135deg, #fff2f5, #fff8eb);
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid #ffe3ec;
      box-shadow: 0 2px 6px rgba(255, 107, 139, 0.08);
    }
    .wish-info {
      flex: 1;
    }
    .wish-title {
      font-size: 15px;
      font-weight: 700;
      color: #3d314a;
      margin-bottom: 4px;
    }
    .wish-desc {
      font-size: 13.5px;
      color: #7b6f84;
      line-height: 1.5;
    }

    /* Photos Section (Conditional) */
    .photos-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px 18px;
      box-shadow: var(--shadow-md);
      margin-bottom: 34px;
    }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .photo-item {
      background: #ffffff;
      padding: 8px 8px 12px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      border: 1px solid #f2e6ea;
      transition: transform 0.3s ease;
    }
    .photo-item:hover {
      transform: scale(1.02);
    }
    .photo-item img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    /* Footer */
    .app-footer {
      text-align: center;
      padding: 20px 10px 40px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .footer-divider {
      width: 60px;
      height: 2px;
      background: #ffd3df;
      margin: 0 auto 16px;
      border-radius: 2px;
    }
    .footer-text {
      margin-bottom: 6px;
    }
    .footer-from {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-dark);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .heart-pulse {
      display: inline-block;
      animation: heartBeat 1.4s infinite;
      color: #ff3366;
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.22); }
      28% { transform: scale(1); }
      42% { transform: scale(1.22); }
      70% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <!-- Canvas for celebration confetti -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Ambient floating balloons background -->
  <div class="balloons-container" id="balloons-container"></div>

  <!-- Music toggle button -->
  <button id="audio-toggle" class="audio-btn" aria-label="生日音乐开关">
    <span id="audio-icon">🎵</span>
    <span id="audio-text">播放生日歌</span>
  </button>

  <main class="app-wrapper">
    <!-- Header / Hero -->
    <header class="hero-section">
      <div class="badge">
        <span>🎂</span>
        <span>TODAY IS YOUR DAY</span>
      </div>
      <h1 class="main-title" id="hero-title">王竞乾 生日快乐</h1>
      <p class="subtitle" id="hero-subtitle">愿岁岁常欢愉，万事皆胜意</p>
    </header>

    <div id="cake-area">
      <div class="cake-card">
        <p class="cake-instruction">
          <span class="icon">✨</span>
          <span>轻触或点击单支蜡烛许愿吹灭，也可点击下方一键吹灭</span>
        </p>

        <div class="cake-stage" id="cake-stage">
          <!-- Candles rendered dynamically by JS based on CONFIG.candles -->
          <div class="candles-row" id="candles-row" role="region" aria-label="生日蜡烛"></div>

          <!-- Pure SVG Birthday Cake -->
          <svg class="cake-svg" viewBox="0 0 280 170" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#e2e8f0"/>
              </linearGradient>
              <linearGradient id="bottomTierGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ffb3c1"/>
                <stop offset="50%" stop-color="#ffccd5"/>
                <stop offset="100%" stop-color="#ffb3c1"/>
              </linearGradient>
              <linearGradient id="topTierGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ffe5d9"/>
                <stop offset="50%" stop-color="#fff1e6"/>
                <stop offset="100%" stop-color="#ffe5d9"/>
              </linearGradient>
              <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#fff0f5"/>
              </linearGradient>
              <linearGradient id="cherryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff4d6d"/>
                <stop offset="100%" stop-color="#c9184a"/>
              </linearGradient>
            </defs>

            <!-- Cake Plate Shadow & Plate -->
            <ellipse cx="140" cy="158" rx="122" ry="12" fill="rgba(180, 100, 130, 0.12)"/>
            <ellipse cx="140" cy="154" rx="120" ry="12" fill="url(#plateGrad)" stroke="#ffd6e0" stroke-width="1.5"/>
            <ellipse cx="140" cy="152" rx="112" ry="9" fill="#ffffff" opacity="0.8"/>

            <!-- Bottom Tier Body -->

  <script>
    /* ==========================================================================
       CONFIG: 全局生日贺卡配置对象
       所有展示文本与核心参数均从此对象读取，方便后续按需自由定制修改
       ========================================================================== */
    const CONFIG = {
      name: "王竞乾",
      title: "生日快乐",
      from: "来自朋友的祝福",
      candles: 5,
      date: "2026.10.23",           // 生日日期，显示在副标题前
      subtitle: "愿岁岁常欢愉，万事皆胜意，所念皆星河",
      wishes: [
        { icon: "🍀", title: "健康平安", desc: "愿你身心自在，无疾无忧，岁岁平安祥和。" },
        { icon: "✨", title: "开心每一天", desc: "愿你常有欢喜，每天都能收获纯粹而真挚的笑容。" },
        { icon: "🎯", title: "所愿皆所得", desc: "愿你的付出皆有回响，心中所想皆能如期而至。" },
        { icon: "🌸", title: "被温柔以待", desc: "愿世界对你格外温柔，愿你的生活洒满暖阳与花香。" },
        { icon: "🚀", title: "前路坦荡", desc: "愿你勇敢追光，不负热爱，步履不停，未来繁花似锦。" },
        { icon: "🎁", title: "惊喜常伴", desc: "新的一岁，愿生活时常为你准备可爱而温暖的小惊喜！" }
      ],
      // 可选相册：留空 [] 则页面不渲染该模块；填入图片路径或 base64 如 ["photo1.jpg"] 即会自动渲染
      photos: [],
      letter: "亲爱的王竞乾：\n\n在这个特别又美好的日子里，祝你生日快乐！🎉\n\n生活就像一本翻开的书，愿你在新的一岁里，写下更多温暖与灿烂的篇章。无论前路晴雨，愿你心中始终留存一份轻盈与从容；无论走多远，都有好运与爱相伴。\n\n愿你眼里有星辰大海，心中有繁花似锦；愿你尝遍世间美味，体会人间温暖。生日快乐，岁岁欢愉，万事顺意！"
    };

    /* --- Utility to escape HTML strings --- */
    function escapeHtml(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[&<>"']/g, (m) => {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m];
      });
    }

    /* --- DOM Elements --- */
    const heroTitle = document.getElementById('hero-title');
    const heroSubtitle = document.getElementById('hero-subtitle');
    const bannerName = document.getElementById('banner-name');
    const candlesRow = document.getElementById('candles-row');
    const blowAllBtn = document.getElementById('blow-all-btn');
    const relightBtn = document.getElementById('relight-btn');
    const wishBanner = document.getElementById('wish-banner');
    const balloonsContainer = document.getElementById('balloons-container');
    const audioToggle = document.getElementById('audio-toggle');
    const audioIcon = document.getElementById('audio-icon');
    const audioText = document.getElementById('audio-text');
    const confettiCanvas = document.getElementById('confetti-canvas');

    /* --- Initialize Texts from CONFIG --- */
    document.title = `${CONFIG.name} ${CONFIG.title} 🎂`;
    heroTitle.textContent = `${CONFIG.name} ${CONFIG.title}`;
    heroSubtitle.textContent = (CONFIG.date ? CONFIG.date + " · " : "") + CONFIG.subtitle;
    bannerName.textContent = CONFIG.name;

    /* --- Background Balloons Generator --- */
    function initBalloons() {
      const balloonColors = ['#ff8da6', '#70d6ff', '#ffd166', '#c77dff', '#06d6a0', '#ff9ebb', '#b8c0ff'];
      const balloonCount = 14;
      for (let i = 0; i < balloonCount; i++) {
        const balloon = document.createElement('div');
        balloon.className = 'balloon';
        const color = balloonColors[i % balloonColors.length];
        const left = Math.random() * 95;
        const sizeScale = 0.75 + Math.random() * 0.55;
        const duration = 12 + Math.random() * 10;
        const delay = Math.random() * 12;

        balloon.style.backgroundColor = color;
        balloon.style.left = `${left}%`;
        balloon.style.transform = `scale(${sizeScale})`;
        balloon.style.animationDuration = `${duration}s`;
        balloon.style.animationDelay = `${delay}s`;
        balloonsContainer.appendChild(balloon);
      }
    }

    /* --- Candles Initialization & Logic --- */
    let candlesLit = CONFIG.candles;
    const candleElements = [];

    function initCandles() {
      candlesRow.innerHTML = '';
      candleElements.length = 0;
      candlesLit = CONFIG.candles;

      for (let i = 0; i < CONFIG.candles; i++) {
        const candleUnit = document.createElement('div');
        candleUnit.className = 'candle-unit';
        candleUnit.setAttribute('role', 'button');
        candleUnit.setAttribute('tabindex', '0');
        candleUnit.setAttribute('aria-label', `生日蜡烛 ${i + 1}，点击吹灭`);
        candleUnit.title = '轻触吹灭这支蜡烛';

        const flameWrapper = document.createElement('div');
        flameWrapper.className = 'flame-wrapper';

        const flame = document.createElement('div');
        flame.className = 'flame';

        const smoke = document.createElement('div');
        smoke.className = 'smoke-puff';

        flameWrapper.appendChild(flame);
        flameWrapper.appendChild(smoke);

        const wick = document.createElement('div');
        wick.className = 'candle-wick';

        const stick = document.createElement('div');
        stick.className = `candle-stick c-color-${i % 6}`;

        candleUnit.appendChild(flameWrapper);
        candleUnit.appendChild(wick);
        candleUnit.appendChild(stick);

        // Click / touch handler for individual candle
        const blowOutSingle = (e) => {
          if (e) e.stopPropagation();
          if (!candleUnit.classList.contains('extinguished')) {
            extinguishCandle(candleUnit);
          }
        };

        candleUnit.addEventListener('click', blowOutSingle);
        candleUnit.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            blowOutSingle();
          }
        });

        candlesRow.appendChild(candleUnit);
        candleElements.push(candleUnit);
      }
    }

    function extinguishCandle(unit) {
      if (unit.classList.contains('extinguished')) return;
      unit.classList.add('extinguished');
      unit.setAttribute('aria-label', '蜡烛已吹灭');
      candlesLit--;

      // Micro celebration confetti at candle location
      const rect = unit.getBoundingClientRect();
      createMicroBurst(rect.left + rect.width / 2, rect.top + 10);

      if (candlesLit <= 0) {
        onAllCandlesExtinguished();
      }
    }

    function onAllCandlesExtinguished() {
      wishBanner.classList.add('visible');
      blowAllBtn.style.display = 'none';
      relightBtn.style.display = 'inline-flex';
      // Trigger major confetti explosion
      triggerConfettiExplosion();
    }

    function relightAllCandles() {
      candleElements.forEach((unit, idx) => {
        unit.classList.remove('extinguished');
        unit.setAttribute('aria-label', `生日蜡烛 ${idx + 1}，点击吹灭`);
      });
      candlesLit = CONFIG.candles;
      wishBanner.classList.remove('visible');
      relightBtn.style.display = 'none';
      blowAllBtn.style.display = 'inline-flex';
    }

    function blowAllCandles() {
      const activeUnits = candleElements.filter(u => !u.classList.contains('extinguished'));
      if (activeUnits.length === 0) return;

      activeUnits.forEach((unit, idx) => {
        setTimeout(() => {
          extinguishCandle(unit);
        }, idx * 120);
      });
    }

    blowAllBtn.addEventListener('click', blowAllCandles);
    relightBtn.addEventListener('click', relightAllCandles);

    /* --- Pure Canvas Confetti System --- */
    const ctx = confettiCanvas.getContext('2d');
    let width = 0;
    let height = 0;
    const particles = [];
    const colors = ['#ff4d6d', '#ff758f', '#ffb703', '#fb8500', '#70d6ff', '#38b000', '#9d4edd', '#ff9ebb'];

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      confettiCanvas.width = width * dpr;
      confettiCanvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, vx, vy, color, size, isBurst = false) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.isBurst = isBurst;
        this.rotation = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 8;
        this.opacity = 1;
        this.shape = Math.random() > 0.4 ? 'rect' : 'circle';
        this.decay = isBurst ? 0.006 + Math.random() * 0.008 : 0.002;
        this.gravity = isBurst ? 0.22 : 0.04;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.985;
        this.rotation += this.rotSpeed;
        if (this.isBurst) {
          this.opacity -= this.decay;
        } else if (this.y > height + 20) {
          this.y = -20;
          this.x = Math.random() * width;
        }
      }

      draw() {
        if (this.opacity <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = this.color;

        if (this.shape === 'rect') {
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.7);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // Ambient floating confetti on initial load
    function initAmbientConfetti() {
      for (let i = 0; i < 24; i++) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        const vx = (Math.random() - 0.5) * 0.6;
        const vy = 0.5 + Math.random() * 1.0;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = 6 + Math.random() * 6;
        particles.push(new Particle(x, y, vx, vy, color, size, false));
      }
    }

    function createMicroBurst(x, y) {
      for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed - 2;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = 4 + Math.random() * 4;
        particles.push(new Particle(x, y, vx, vy, color, size, true));
      }
    }

    function triggerConfettiExplosion() {
      const centerX = width / 2;
      const centerY = height * 0.45;
      for (let i = 0; i < 160; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 14;
        const vx = Math.cos(angle) * speed * (0.8 + Math.random() * 0.5);
        const vy = Math.sin(angle) * speed - 6;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = 6 + Math.random() * 8;
        particles.push(new Particle(centerX, centerY, vx, vy, color, size, true));
      }
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, width, height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.isBurst && p.opacity <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(renderConfetti);
    }

    /* --- Web Audio API Synthesizer (Happy Birthday) --- */
    let audioCtx = null;
    let isPlaying = false;
    let melodyTimeouts = [];

    // Frequencies of notes
    const NOTE_FREQ = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00
    };

    // Happy Birthday notes and beat durations
    const MELODY = [
      { note: 'G4', dur: 0.75 }, { note: 'G4', dur: 0.25 }, { note: 'A4', dur: 1.0 }, { note: 'G4', dur: 1.0 }, { note: 'C5', dur: 1.0 }, { note: 'B4', dur: 2.0 },
      { note: 'G4', dur: 0.75 }, { note: 'G4', dur: 0.25 }, { note: 'A4', dur: 1.0 }, { note: 'G4', dur: 1.0 }, { note: 'D5', dur: 1.0 }, { note: 'C5', dur: 2.0 },
      { note: 'G4', dur: 0.75 }, { note: 'G4', dur: 0.25 }, { note: 'G5', dur: 1.0 }, { note: 'E5', dur: 1.0 }, { note: 'C5', dur: 1.0 }, { note: 'B4', dur: 1.0 }, { note: 'A4', dur: 1.5 },
      { note: 'F5', dur: 0.75 }, { note: 'F5', dur: 0.25 }, { note: 'E5', dur: 1.0 }, { note: 'C5', dur: 1.0 }, { note: 'D5', dur: 1.0 }, { note: 'C5', dur: 2.2 }
    ];

    function playTone(freq, durationSec) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      // Warm music box / soft marimba sound
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.28, audioCtx.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durationSec * 0.95);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + durationSec);
    }

    function stopMelody() {
      melodyTimeouts.forEach(t => clearTimeout(t));
      melodyTimeouts = [];
      isPlaying = false;
      audioToggle.classList.remove('playing');
      audioIcon.textContent = '🎵';
      audioText.textContent = '播放生日歌';
    }

    function playMelodyLoop() {
      if (!isPlaying) return;
      const beatUnit = 380; // ms per beat
      let accumulatedTime = 0;

      MELODY.forEach((item) => {
        const timeout = setTimeout(() => {
          if (!isPlaying) return;
          const freq = NOTE_FREQ[item.note];
          if (freq) {
            playTone(freq, (item.dur * beatUnit) / 1000);
          }
        }, accumulatedTime);
        melodyTimeouts.push(timeout);
        accumulatedTime += item.dur * beatUnit;
      });

      // Loop after melody finishes
      const loopTimeout = setTimeout(() => {
        if (isPlaying) {
          playMelodyLoop();
        }
      }, accumulatedTime + 1200);
      melodyTimeouts.push(loopTimeout);
    }

    audioToggle.addEventListener('click', () => {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (isPlaying) {
        stopMelody();
      } else {
        isPlaying = true;
        audioToggle.classList.add('playing');
        audioIcon.textContent = '⏸️';
        audioText.textContent = '暂停音乐';
        playMelodyLoop();
      }
    });

    /* --- Heartfelt Letter Rendering --- */
    function renderLetter() {
      const container = document.getElementById('letter-area');
      if (!CONFIG.letter) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = `
        <div class="section-header">
          <h2 class="section-title">💌 见信如面</h2>
        </div>
        <div class="letter-card">
          <div class="letter-seal">
            <span>✨</span>
            <span>A Special Note</span>
          </div>
          <div class="letter-content" id="letter-text"></div>
        </div>
      `;
      document.getElementById('letter-text').textContent = CONFIG.letter;
    }

    /* --- Wishes Cards Rendering (Fade-in on scroll) --- */
    function renderWishes() {
      const container = document.getElementById('wishes-area');
      if (!CONFIG.wishes || CONFIG.wishes.length === 0) {
        container.innerHTML = '';
        return;
      }

      let cardsHtml = '';
      CONFIG.wishes.forEach((w) => {
        cardsHtml += `
          <div class="wish-card">
            <div class="wish-icon-box" aria-hidden="true">${escapeHtml(w.icon || '🌟')}</div>
            <div class="wish-info">
              <h3 class="wish-title">${escapeHtml(w.title)}</h3>
              <p class="wish-desc">${escapeHtml(w.desc)}</p>
            </div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="section-header">
          <h2 class="section-title">🎁 心意寄语</h2>
        </div>
        <div class="wishes-grid">
          ${cardsHtml}
        </div>
      `;

      // Intersection Observer for graceful fade-in on scroll
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in-view');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });

        container.querySelectorAll('.wish-card').forEach((card) => {
          observer.observe(card);
        });
      } else {
        // Fallback for older browsers
        container.querySelectorAll('.wish-card').forEach((card) => {
          card.classList.add('in-view');
        });
      }
    }

    /* --- Photos Section (Only renders if CONFIG.photos is non-empty) --- */
    function renderPhotos() {
      const container = document.getElementById('photos-area');
      if (!CONFIG.photos || CONFIG.photos.length === 0) {
        container.innerHTML = '';
        return;
      }

      let photosHtml = '';
      CONFIG.photos.forEach((src, idx) => {
        photosHtml += `
          <div class="photo-item">
            <img src="${escapeHtml(src)}" alt="美好记忆 ${idx + 1}" loading="lazy">
          </div>
        `;
      });

      container.innerHTML = `
        <div class="section-header">
          <h2 class="section-title">📷 美好瞬间</h2>
        </div>
        <div class="photos-card">
          <div class="photos-grid">
            ${photosHtml}
          </div>
        </div>
      `;
    }

    /* --- Footer Rendering --- */
    function renderFooter() {
      const container = document.getElementById('footer-area');
      container.className = 'app-footer';
      container.innerHTML = `
        <div class="footer-divider"></div>
        <p class="footer-text">愿你的每一天都沐浴在温暖与欢笑中</p>
        <p class="footer-from">
          <span>${escapeHtml(CONFIG.from)}</span>
          <span class="heart-pulse">💖</span>
        </p>
      `;
    }
